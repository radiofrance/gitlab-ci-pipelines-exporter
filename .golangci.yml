---
version: "2"
run:
  concurrency: 4
linters:
  default: all
  disable:
    - depguard
    - dupl
    - err113
    - exhaustive
    - exhaustruct
    - exhaustruct_v5
    - funlen
    - gochecknoglobals
    - mnd
    - nlreturn
    - noinlineerr
    - perfsprint
    - tagliatelle
    - wsl
    - wsl_v5
  exclusions:
    generated: lax
    rules:
      - path: _test\.go
        linters:
          - goconst
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
